<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<title>{{ site.name }} — CV</title>
<style>
  /* Print-specific styling. Uses the same palette as the site but
     resolved to fixed values, since WeasyPrint renders without a viewer theme. */
  @page {
    size: A4;
    margin: 18mm 16mm 16mm;
    @bottom-center {
      content: "{{ site.name }} — CV — page " counter(page) " of " counter(pages);
      font-family: "IBM Plex Sans", sans-serif; font-size: 7.5pt; color: #7c7c86;
    }
  }
  @font-face { font-family: "IBM Plex Sans"; src: url("{{ fonts }}/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "IBM Plex Sans"; src: url("{{ fonts }}/ibm-plex-sans-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
  @font-face { font-family: "IBM Plex Sans"; src: url("{{ fonts }}/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; }
  @font-face { font-family: "JetBrains Mono"; src: url("{{ fonts }}/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }

  body { font-family: "IBM Plex Sans", sans-serif; font-size: 9.5pt; line-height: 1.5; color: #17171a; margin: 0; }
  h1 { font-family: "IBM Plex Sans", sans-serif; font-size: 22pt; font-weight: 600; margin: 0 0 2mm; letter-spacing: -0.02em; }
  .meta { font-size: 8.5pt; color: #4a4a52; margin: 0 0 6mm; padding-bottom: 4mm; border-bottom: 0.4pt solid #17171a; }
  .meta a { color: #0e6a5e; text-decoration: none; }
  h2 { font-family: "JetBrains Mono", monospace; font-size: 8pt; font-weight: 400;
       text-transform: uppercase; letter-spacing: 0.14em; color: #0e6a5e;
       margin: 7mm 0 2.5mm; padding-bottom: 1.2mm; border-bottom: 0.4pt solid rgba(23,23,26,0.15);
       break-after: avoid; }
  h3 { font-family: "IBM Plex Sans", sans-serif; font-size: 11pt; font-weight: 600; margin: 4mm 0 1mm; break-after: avoid; }
  p { margin: 0 0 2.5mm; }
  ul { margin: 0 0 3mm; padding-left: 4.5mm; }
  li { margin-bottom: 1.2mm; }
  a { color: #17171a; text-decoration: none; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 3mm; }
  td { vertical-align: top; padding: 1.2mm 0; border-bottom: 0.3pt solid rgba(23,23,26,0.08); }
  td:first-child { width: 30mm; font-family: "JetBrains Mono", monospace; font-size: 8pt; color: #7c7c86; }
  hr { border: 0; border-top: 0.4pt solid rgba(23,23,26,0.15); margin: 5mm 0; }
  code { font-family: "JetBrains Mono", monospace; font-size: 8.5pt; }
  .placeholder { border-left: 1.5pt solid #0e6a5e; background: rgba(14,106,94,0.06);
                 padding: 3mm 4mm; font-size: 8.5pt; margin: 3mm 0; }
  .placeholder strong { display: block; font-family: "JetBrains Mono", monospace;
                        font-size: 7pt; text-transform: uppercase; letter-spacing: 0.08em;
                        color: #0e6a5e; margin-bottom: 1.5mm; }
</style>
</head>
<body>
  <h1>{{ site.name }}</h1>
  <p class="meta">
    {{ site.role }} · {{ site.affiliation }} · {{ site.location }}<br>
    {% for link in site.links %}<a href="{{ link.url }}">{{ link.name }}</a>{% if not loop.last %} · {% endif %}{% endfor %}
  </p>
  {{ page.html|safe }}
</body>
</html>
