{% extends "base.html" %}

{% block content %}
<div class="wrap">
  <header class="page-head">
    <h1 class="page-head__title">Blog</h1>
    <p class="page-head__sub"><a href="/blog/feed.xml">RSS</a></p>
  </header>

  <ul class="post-list">
    {% for post in posts %}
    <li class="post-item">
      <span class="post-item__date"><time datetime="{{ post.date_iso }}">{{ post.date_display }}</time></span>
      <h2 class="post-item__title"><a href="{{ post.url }}">{{ post.title }}</a></h2>
      <p class="post-item__excerpt">{{ post.excerpt }}</p>
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
