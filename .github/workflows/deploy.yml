name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh publications from ORCID weekly, Monday 05:00 UTC
    - cron: "0 5 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps for WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Refresh publications from ORCID
        # Never fail the build because an external API was unreachable —
        # the committed publications.json is used as the fallback.
        continue-on-error: true
        run: python scripts/fetch_publications.py

      - name: Commit refreshed publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/publications.json
          if git diff --cached --quiet; then
            echo "No publication changes."
          else
            git commit -m "chore: refresh publications from ORCID [skip ci]"
            git push
          fi

      - name: Build
        run: python build.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
