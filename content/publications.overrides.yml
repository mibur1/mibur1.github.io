# =============================================================
# Manual curation of the publication list.
#
# content/publications.json is REGENERATED by scripts/fetch_publications.py and
# should never be hand-edited. This file is the opposite: the fetcher never
# writes to it, and everything here is applied on top at build time, keyed by
# DOI (lowercase). So you can re-scrape as often as you like without losing a
# single edit.
#
# ---- supported keys, per DOI -------------------------------------------
#   hide: true            drop the entry entirely
#   pin: <int>            force order within a year (lower sorts first)
#
#   title:                fix mangled or over-long metadata
#   venue:
#   year:
#   citations:
#
#   url:                  where the TITLE links. Defaults to the journal via
#                         doi.org — set this only to override that.
#   pdf_url:              the "PDF · Open access" button. Use for a copy the
#                         APIs do not know about, e.g. your own hosted file.
#   preprint_url:         the "Preprint" button
#   code_url:             the "Code" button
#   data_url:             the "Data" button
#
#   note:                 free text, not currently rendered
#
# Titles link to the version of record by default, never to a preprint or a
# repository copy — the PDF button is likewise only ever the peer-reviewed
# article, with preprints shown separately.
# =============================================================

"10.1162/imag.a.1122":
  code_url: https://github.com/mibur1/comet

"10.1177/25152459261434881":
  pdf_url: https://journals.sagepub.com/doi/epub/10.1177/25152459261434881

